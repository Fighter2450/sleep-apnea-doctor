<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#060b13"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce8ff"/>
      <stop offset="100%" stop-color="#a8bfff"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6080e8"/>
      <stop offset="100%" stop-color="#9060d8"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="zGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crossGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="moonClip">
      <circle cx="210" cy="155" r="105"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="420" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="30" cy="45" r="1" fill="#c8daff" opacity="0.5"/>
  <circle cx="72" cy="18" r="0.8" fill="#c8daff" opacity="0.4"/>
  <circle cx="380" cy="30" r="1.1" fill="#c8daff" opacity="0.45"/>
  <circle cx="400" cy="80" r="0.7" fill="#c8daff" opacity="0.35"/>
  <circle cx="18" cy="310" r="0.9" fill="#c8daff" opacity="0.3"/>
  <circle cx="395" cy="340" r="1" fill="#c8daff" opacity="0.35"/>
  <circle cx="55" cy="390" r="0.7" fill="#c8daff" opacity="0.25"/>
  <circle cx="360" cy="395" r="0.8" fill="#c8daff" opacity="0.3"/>

  <!-- Moon ambient glow -->
  <circle cx="210" cy="155" r="108" fill="#1a2a50" opacity="0.35" filter="url(#moonGlow)"/>

  <!-- Full moon -->
  <circle cx="210" cy="155" r="105" fill="url(#moonGrad)"/>

  <!-- Dark side shadow -->
  <circle cx="248" cy="148" r="98" fill="#080f1d"/>

  <!-- Cross inside moon, on dark side, away from crescent edge — centered in dark region -->
  <g clip-path="url(#moonClip)">
    <g transform="translate(225, 155)" filter="url(#crossGlow)">
      <rect x="-13" y="-42" width="26" height="84" rx="4" fill="url(#crossGrad)" opacity="0.9"/>
      <rect x="-42" y="-13" width="84" height="26" rx="4" fill="url(#crossGrad)" opacity="0.9"/>
    </g>
  </g>

  <!-- z z z ascending off bright crescent -->
  <text x="282" y="98" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="26" fill="#a8bfff" opacity="0.45" filter="url(#zGlow)">z</text>
  <text x="308" y="72" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="36" fill="#a8bfff" opacity="0.6" filter="url(#zGlow)">z</text>
  <text x="342" y="42" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="48" fill="#a8bfff" opacity="0.75" filter="url(#zGlow)">z</text>

  <!-- Divider line -->
  <line x1="60" y1="285" x2="360" y2="285" stroke="#2a3e7a" stroke-width="1" opacity="0.6"/>

  <!-- SLEEP -->
  <text x="210" y="330"
    font-family="Palatino Linotype, Palatino, Book Antiqua, serif"
    font-size="52" font-weight="700" letter-spacing="6"
    fill="#dce8ff" text-anchor="middle"
    filter="url(#textGlow)">SLEEP</text>

  <!-- DOCTERS UNITED -->
  <text x="210" y="368"
    font-family="Palatino Linotype, Palatino, Book Antiqua, serif"
    font-size="22" font-weight="400" letter-spacing="8"
    fill="#7a96d4" text-anchor="middle">DOCTERS UNITED</text>

</svg>
