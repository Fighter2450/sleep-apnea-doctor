<svg viewBox="0 0 430 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hbg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#060b13"/>
    </radialGradient>
    <linearGradient id="hmoonGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce8ff"/>
      <stop offset="100%" stop-color="#a8bfff"/>
    </linearGradient>
    <linearGradient id="hcrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6080e8"/>
      <stop offset="100%" stop-color="#9060d8"/>
    </linearGradient>
    <filter id="hmoonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="htextGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hzGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hcrossGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hmoonClip">
      <circle cx="62" cy="60" r="50"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="430" height="120" fill="url(#hbg)" rx="8"/>

  <!-- Stars -->
  <circle cx="15"  cy="18" r="0.8" fill="#c8daff" opacity="0.5"/>
  <circle cx="200" cy="8"  r="0.6" fill="#c8daff" opacity="0.4"/>
  <circle cx="380" cy="14" r="0.9" fill="#c8daff" opacity="0.45"/>
  <circle cx="415" cy="52" r="0.6" fill="#c8daff" opacity="0.3"/>
  <circle cx="420" cy="96" r="0.7" fill="#c8daff" opacity="0.25"/>
  <circle cx="10"  cy="97" r="0.7" fill="#c8daff" opacity="0.3"/>

  <!-- Moon ambient glow -->
  <circle cx="62" cy="60" r="53" fill="#1a2a50" opacity="0.35" filter="url(#hmoonGlow)"/>

  <!-- Full moon -->
  <circle cx="62" cy="60" r="50" fill="url(#hmoonGrad)"/>

  <!-- Dark side shadow (crescent faces left) -->
  <circle cx="80" cy="57" r="46" fill="#080f1d"/>

  <!-- Cross inside moon on dark side -->
  <g clip-path="url(#hmoonClip)">
    <g transform="translate(69, 60)" filter="url(#hcrossGlow)">
      <rect x="-6" y="-20" width="12" height="40" rx="2" fill="url(#hcrossGrad)" opacity="0.9"/>
      <rect x="-20" y="-6" width="40" height="12" rx="2" fill="url(#hcrossGrad)" opacity="0.9"/>
    </g>
  </g>

  <!-- z z z ascending upper-right from crescent -->
  <text x="104" y="38" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="13" fill="#a8bfff" opacity="0.45" filter="url(#hzGlow)">z</text>
  <text x="116" y="24" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="17" fill="#a8bfff" opacity="0.60" filter="url(#hzGlow)">z</text>
  <text x="130" y="11" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="22" fill="#a8bfff" opacity="0.75" filter="url(#hzGlow)">z</text>

  <!-- Vertical divider -->
  <line x1="148" y1="18" x2="148" y2="102" stroke="#2a3e7a" stroke-width="1" opacity="0.6"/>

  <!-- SLEEP -->
  <text x="162" y="72"
    font-family="Palatino Linotype, Palatino, Book Antiqua, serif"
    font-size="46" font-weight="700" letter-spacing="5"
    fill="#dce8ff"
    filter="url(#htextGlow)">SLEEP</text>

  <!-- DOCTERS UNITED -->
  <text x="165" y="98"
    font-family="Palatino Linotype, Palatino, Book Antiqua, serif"
    font-size="16" font-weight="400" letter-spacing="6"
    fill="#7a96d4">DOCTERS UNITED</text>

</svg>
